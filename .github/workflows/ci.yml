name: Private application checks
run-name: private-check-${{ inputs.suite }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private source commit (40 lowercase hex characters)
        required: true
        type: string
      suite:
        required: true
        type: choice
        options:
          [
            core,
            mobile,
            p01,
            android-preview-arm64,
            android-owner-arm64,
            android-preview-x86,
            android-owner-x86,
          ]
permissions:
  contents: read
jobs:
  check:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: ${{ inputs.suite == 'core' && 'postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5' || '' }}
        env:
          POSTGRES_USER: lammah_test
          POSTGRES_PASSWORD: lammah-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lammah_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: startsWith(inputs.suite, 'android-')
        with:
          distribution: temurin
          java-version: "17"
      - name: Read exact private commit with a dedicated read-only key
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_SUITE: ${{ inputs.suite }}
          SOURCE_SSH_KEY: ${{ secrets.LAMMAH_READONLY_SOURCE }}
        run: node checkout.mjs
      - name: Run private checks without source credentials
        if: always()
        id: controller
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_SUITE: ${{ inputs.suite }}
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node controller.mjs
      - name: Upload encrypted report only
        if: always() && steps.controller.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.suite }}
          path: sealed-report.lci
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
